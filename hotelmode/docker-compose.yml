services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotelmode
      POSTGRES_USER: hotelmode
      POSTGRES_PASSWORD: hotelmode
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelmode"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://hotelmode:hotelmode@db:5432/hotelmode
      DATABASE_SSL: "false"
    volumes:
      # Persist the generated Excel file between restarts
      - excel_data:/app/data.xlsx

volumes:
  postgres_data:
  excel_data:
